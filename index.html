<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AutoSusu Admin Panel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');
:root{
  --bg:#080b10;--surface:#0d1117;--card:#111722;--border:#1e2a3a;
  --cyan:#00d4ff;--cd:rgba(0,212,255,.12);
  --green:#00ff88;--gd:rgba(0,255,136,.10);
  --red:#ff3d5a;--rd:rgba(255,61,90,.12);
  --yellow:#ffc846;--text:#c8d8e8;--muted:#5a7080;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column}
#ls{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:999}
.lb{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:360px;text-align:center}
.ll{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--cyan);margin-bottom:8px;text-transform:uppercase}
.lt{font-size:22px;font-weight:600;color:#fff;margin-bottom:32px}
.lb input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-family:var(--mono);font-size:14px;color:var(--text);outline:none;margin-bottom:12px;transition:border-color .2s}
.lb input:focus{border-color:var(--cyan)}
.lb input[type=password]{letter-spacing:.15em}
.btn-login{width:100%;padding:13px;background:var(--cyan);color:#000;border:none;border-radius:8px;font-family:var(--sans);font-weight:600;font-size:14px;cursor:pointer;transition:opacity .2s;margin-top:4px}
.btn-login:hover{opacity:.85}
.le{color:var(--red);font-size:12px;margin-top:10px;font-family:var(--mono);min-height:16px}
header{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10}
.logo{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--cyan);letter-spacing:.1em}
.logo span{color:var(--muted);font-weight:400}
.hm{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;gap:20px;align-items:center}
.sd{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 6px var(--green);margin-right:6px}
#btn-lo{background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:11px;padding:5px 12px;border-radius:6px;cursor:pointer;transition:all .2s}
#btn-lo:hover{border-color:var(--red);color:var(--red)}
main{flex:1;display:grid;grid-template-columns:320px 1fr;gap:24px;max-width:1280px;margin:0 auto;width:100%;padding:28px 32px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.ch{padding:16px 20px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:11px;color:var(--cyan);letter-spacing:.1em;text-transform:uppercase}
.cb{padding:20px}
.lc{display:flex;flex-direction:column;gap:16px}
label{display:block;font-size:11px;font-family:var(--mono);color:var(--muted);margin-bottom:6px;letter-spacing:.05em}
select,input[type=text]{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-family:var(--mono);font-size:13px;color:var(--text);outline:none;transition:border-color .2s;appearance:none}
select:focus,input[type=text]:focus{border-color:var(--cyan)}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.db{padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:12px;cursor:pointer;transition:all .2s;text-align:center}
.db:hover{border-color:var(--cyan);color:var(--cyan)}
.db.active{border-color:var(--cyan);background:var(--cd);color:var(--cyan)}
.btn-gen{width:100%;padding:14px;background:linear-gradient(135deg,#0090b3,#00d4ff);color:#000;border:none;border-radius:8px;font-family:var(--sans);font-weight:700;font-size:14px;cursor:pointer;letter-spacing:.03em;transition:opacity .2s,transform .1s}
.btn-gen:hover{opacity:.9}
.btn-gen:active{transform:scale(.98)}
.kr{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;display:none;flex-direction:column;gap:10px}
.kr.show{display:flex}
.kd{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--cyan);letter-spacing:.08em;word-break:break-all}
.km{font-family:var(--mono);font-size:10px;color:var(--muted)}
.btn-copy{padding:8px 16px;background:var(--cd);border:1px solid var(--cyan);border-radius:6px;color:var(--cyan);font-family:var(--mono);font-size:11px;cursor:pointer;transition:all .2s;align-self:flex-start}
.btn-copy:hover{background:var(--cyan);color:#000}
.sr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sb{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 12px;text-align:center}
.sn{font-family:var(--mono);font-size:22px;font-weight:700;color:#fff;line-height:1;margin-bottom:4px}
.sl{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.rc{display:flex;flex-direction:column;gap:16px}
.lt2{display:flex;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border)}
.lt2 input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-family:var(--mono);font-size:12px;color:var(--text);outline:none}
.lt2 input:focus{border-color:var(--cyan)}
.btn-exp,.btn-ref{padding:8px 14px;background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-family:var(--mono);font-size:11px;cursor:pointer;white-space:nowrap;transition:all .2s}
.btn-exp:hover{border-color:var(--cyan);color:var(--cyan)}
.btn-ref:hover{border-color:var(--green);color:var(--green)}
.ktw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono)}
thead th{padding:10px 16px;text-align:left;font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid rgba(30,42,58,.6);transition:background .15s}
tbody tr:hover{background:rgba(0,212,255,.04)}
td{padding:12px 16px;vertical-align:top;color:var(--text)}
.kc{color:var(--cyan);font-weight:600;letter-spacing:.06em;white-space:nowrap}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.ba{background:var(--gd);color:var(--green);border:1px solid rgba(0,255,136,.25)}
.be{background:var(--rd);color:var(--red);border:1px solid rgba(255,61,90,.25)}
.bp{background:rgba(255,200,70,.10);color:var(--yellow);border:1px solid rgba(255,200,70,.25)}
.dl{display:flex;flex-direction:column;gap:3px}
.dc{font-size:10px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 7px;display:inline-block;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd{color:var(--border);font-size:11px}
.btn-rev{padding:4px 10px;background:none;border:1px solid var(--border);border-radius:5px;color:var(--muted);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-rev:hover{border-color:var(--red);color:var(--red)}
.es{text-align:center;padding:60px 20px;color:var(--muted);font-family:var(--mono);font-size:12px;line-height:2}
#toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 18px;font-family:var(--mono);font-size:12px;color:var(--text);transform:translateY(80px);opacity:0;transition:all .3s;z-index:100;pointer-events:none}
#toast.show{transform:translateY(0);opacity:1}
#toast.ok{border-color:var(--green);color:var(--green)}
#toast.err{border-color:var(--red);color:var(--red)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.lr td{text-align:center;color:var(--muted);font-size:11px;padding:40px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="ls">
  <div class="lb">
    <div class="ll">AutoSusu CPRP</div>
    <div class="lt">Admin Panel</div>
    <input type="text" id="lu" placeholder="Username" autocomplete="off"/>
    <input type="password" id="lp" placeholder="Password"/>
    <button class="btn-login" onclick="doLogin()">Masuk</button>
    <div class="le" id="le"></div>
  </div>
</div>

<header>
  <div class="logo">AutoSusu <span>/ Admin</span></div>
  <div class="hm">
    <span><span class="sd"></span>Firebase</span>
    <span id="ht"></span>
    <button id="btn-lo" onclick="doLogout()">Logout</button>
  </div>
</header>

<main>
  <div class="lc">
    <div class="card">
      <div class="ch">📊 Statistik</div>
      <div class="cb">
        <div class="sr">
          <div class="sb"><div class="sn" id="st">—</div><div class="sl">Total Key</div></div>
          <div class="sb"><div class="sn" id="sa" style="color:var(--green)">—</div><div class="sl">Aktif</div></div>
          <div class="sb"><div class="sn" id="sd2" style="color:var(--cyan)">—</div><div class="sl">Device</div></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="ch">🔑 Generate Key</div>
      <div class="cb" style="display:flex;flex-direction:column;gap:16px">
        <div>
          <label>Label / Nama Pembeli</label>
          <input type="text" id="kl" placeholder="cth: Budi_30hari"/>
        </div>
        <div>
          <label>Durasi Aktif</label>
          <div class="dg">
            <button class="db" data-days="7" onclick="selDur(this)">7 Hari</button>
            <button class="db active" data-days="30" onclick="selDur(this)">30 Hari</button>
            <button class="db" data-days="90" onclick="selDur(this)">90 Hari</button>
            <button class="db" data-days="0" onclick="selDur(this)">Permanent</button>
          </div>
        </div>
        <button class="btn-gen" onclick="generateKey()">Generate Key</button>
        <div class="kr" id="kr">
          <div class="kd" id="ko"></div>
          <div class="km" id="km"></div>
          <button class="btn-copy" onclick="copyKey()">Copy Key</button>
        </div>
      </div>
    </div>
  </div>

  <div class="rc">
    <div class="card" style="flex:1">
      <div class="ch">Daftar Key</div>
      <div class="lt2">
        <input type="text" id="si" placeholder="Cari key atau label..." oninput="filterTable()"/>
        <button class="btn-ref" onclick="loadKeys()">Refresh</button>
        <button class="btn-exp" onclick="exportJSON()">JSON</button>
        <button class="btn-exp" onclick="exportTXT()">TXT</button>
      </div>
      <div class="ktw">
        <table>
          <thead>
            <tr><th>Key</th><th>Label</th><th>Status</th><th>Expired</th><th>Devices</th><th>Dibuat</th><th></th></tr>
          </thead>
          <tbody id="tb">
            <tr class="lr"><td colspan="7"><span class="spin"></span>Memuat...</td></tr>
          </tbody>
        </table>
        <div id="es" class="es" style="display:none">Belum ada key.<br>Buat key pertama di panel kiri.</div>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
const CFG = {
  apiKey:    "AIzaSyAPw1UXjpQIxxznw5Mo8VEkXtaty5upbos",
  projectId: "autosusu-cprp",
  adminUser: "admin",
  adminPass: "luxxy2025",
};

function doLogin(){
  const u=document.getElementById('lu').value.trim();
  const p=document.getElementById('lp').value;
  if(u===CFG.adminUser&&p===CFG.adminPass){
    document.getElementById('ls').style.display='none';
    loadKeys();
  } else {
    document.getElementById('le').textContent='Username atau password salah!';
  }
}
function doLogout(){
  document.getElementById('ls').style.display='flex';
  document.getElementById('lu').value='';
  document.getElementById('lp').value='';
  document.getElementById('le').textContent='';
}
document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

const BASE=`https://firestore.googleapis.com/v1/projects/${CFG.projectId}/databases/(default)/documents`;
const KEY=CFG.apiKey;

async function fbSet(path,fields){
  const r=await fetch(`${BASE}/${path}?key=${KEY}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields})});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function fbDel(path){
  const r=await fetch(`${BASE}/${path}?key=${KEY}`,{method:'DELETE'});
  if(!r.ok)throw new Error(await r.text());
}
async function fbList(col){
  const r=await fetch(`${BASE}/${col}?key=${KEY}&pageSize=200`);
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}

const fStr=v=>({stringValue:v});
const fInt=v=>({integerValue:String(v)});
const fArr=a=>({arrayValue:{values:a.map(v=>({stringValue:v}))}});

function parseField(f){
  if(!f)return null;
  if(f.stringValue!==undefined)return f.stringValue;
  if(f.integerValue!==undefined)return parseInt(f.integerValue);
  if(f.arrayValue!==undefined)return(f.arrayValue.values||[]).map(v=>v.stringValue||'');
  if(f.booleanValue!==undefined)return f.booleanValue;
  return null;
}
function docToObj(doc){
  const o={_id:doc.name.split('/').pop()};
  for(const[k,v]of Object.entries(doc.fields||{}))o[k]=parseField(v);
  return o;
}

let selDays=30,allKeys=[];

function selDur(btn){
  document.querySelectorAll('.db').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  selDays=parseInt(btn.dataset.days);
}

function genKeyStr(){
  const c='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const s=()=>Array.from({length:4},()=>c[Math.floor(Math.random()*c.length)]).join('');
  return `LUXXY-${s()}-${s()}-${s()}`;
}

async function generateKey(){
  const key=genKeyStr();
  const label=document.getElementById('kl').value.trim()||'-';
  const now=Math.floor(Date.now()/1000);
  const exp=selDays===0?0:now+(selDays*86400);
  try{
    await fbSet(`keys/${key}`,{
      key:fStr(key),label:fStr(label),
      expiredAt:fInt(exp),createdAt:fInt(now),
      devices:fArr([]),active:{booleanValue:true}
    });
    document.getElementById('ko').textContent=key;
    document.getElementById('km').textContent=
      `Label: ${label} | Expired: ${exp===0?'PERMANENT':new Date(exp*1000).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}`;
    document.getElementById('kr').classList.add('show');
    document.getElementById('kl').value='';
    toast('Key berhasil dibuat!','ok');
    loadKeys();
  }catch(e){toast('Gagal: '+e.message,'err');}
}

function copyKey(){
  navigator.clipboard.writeText(document.getElementById('ko').textContent)
    .then(()=>toast('Key disalin!','ok'));
}

async function loadKeys(){
  const tb=document.getElementById('tb');
  tb.innerHTML='<tr class="lr"><td colspan="7"><span class="spin"></span>Memuat...</td></tr>';
  try{
    const data=await fbList('keys');
    allKeys=(data.documents||[]).map(docToObj);
    renderTable(allKeys);
    updateStats(allKeys);
  }catch(e){
    tb.innerHTML=`<tr class="lr"><td colspan="7" style="color:var(--red)">Error: ${e.message}</td></tr>`;
  }
}

function renderTable(keys){
  const tb=document.getElementById('tb');
  const es=document.getElementById('es');
  if(!keys.length){tb.innerHTML='';es.style.display='block';return;}
  es.style.display='none';
  const now=Math.floor(Date.now()/1000);
  tb.innerHTML=keys.map(k=>{
    const exp=k.expiredAt||0,perm=exp===0,dead=!perm&&now>exp;
    const badge=perm?'<span class="badge bp">PERMANENT</span>':dead?'<span class="badge be">EXPIRED</span>':'<span class="badge ba">AKTIF</span>';
    const expStr=perm?'Permanent':new Date(exp*1000).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
    const crtStr=k.createdAt?new Date(k.createdAt*1000).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'-';
    const devs=Array.isArray(k.devices)&&k.devices.length
      ?`<div class="dl">${k.devices.map(d=>`<span class="dc" title="${d}">${d}</span>`).join('')}</div>`
      :'<span class="nd">—</span>';
    return `<tr>
      <td class="kc">${k._id}</td>
      <td>${k.label||'-'}</td>
      <td>${badge}</td>
      <td style="font-size:11px;color:var(--muted)">${expStr}</td>
      <td>${devs}</td>
      <td style="font-size:11px;color:var(--muted)">${crtStr}</td>
      <td><button class="btn-rev" onclick="revokeKey('${k._id}')">Revoke</button></td>
    </tr>`;
  }).join('');
}

function updateStats(keys){
  const now=Math.floor(Date.now()/1000);
  const act=keys.filter(k=>{const e=k.expiredAt||0;return k.active!==false&&(e===0||now<e);}).length;
  const dev=keys.reduce((s,k)=>s+(Array.isArray(k.devices)?k.devices.length:0),0);
  document.getElementById('st').textContent=keys.length;
  document.getElementById('sa').textContent=act;
  document.getElementById('sd2').textContent=dev;
}

async function revokeKey(key){
  if(!confirm(`Revoke key ${key}?`))return;
  try{await fbDel(`keys/${key}`);toast('Key direvoke!','ok');loadKeys();}
  catch(e){toast('Gagal: '+e.message,'err');}
}

function filterTable(){
  const q=document.getElementById('si').value.toLowerCase();
  renderTable(allKeys.filter(k=>k._id.toLowerCase().includes(q)||(k.label||'').toLowerCase().includes(q)));
}

function exportJSON(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(allKeys,null,2)],{type:'application/json'}));
  a.download=`autosusu_keys_${Date.now()}.json`;a.click();
}
function exportTXT(){
  const now=Math.floor(Date.now()/1000);
  const txt=allKeys.map(k=>{const e=k.expiredAt||0;return`${k._id}|${k.label||'-'}|${e===0?'PERMANENT':now>e?'EXPIRED':'AKTIF'}`;}).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
  a.download=`autosusu_keys_${Date.now()}.txt`;a.click();
}

let tt;
function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className=`show ${type}`;
  clearTimeout(tt);tt=setTimeout(()=>{el.className=''},2500);
}
function tick(){
  document.getElementById('ht').textContent=
    new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
